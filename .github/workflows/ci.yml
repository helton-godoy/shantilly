name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Debian Trixie / Qt6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build development image
        run: docker build --pull --tag shantilly-ci --file src/dev.Dockerfile .

      - name: Build and test
        run: |
          docker run --rm +            --volume "$GITHUB_WORKSPACE:/workspace" +            --workdir /workspace +            shantilly-ci +            bash -lc '
              cmake -S /workspace -B /tmp/shantilly-build -DCMAKE_BUILD_TYPE=Debug &&
              cmake --build /tmp/shantilly-build --parallel 2 &&
              ctest --test-dir /tmp/shantilly-build --parallel 2 --output-on-failure
            '

  lint:
    name: Repository lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Trunk Check
        uses: trunk-io/trunk-action@v1

  security:
    name: Filesystem security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          hide-progress: false
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH
